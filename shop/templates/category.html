<!DOCTYPE html>
<html>
<head>
    <title>{{ cat|capitalize }} Products</title>
    <style>
        body { 
            font-family: Poppins; 
            background:#F4F4F4; 
            margin:0; 
            padding:20px;
        }

        h1 {
            color:#0C2B4E; 
            text-align:center;
            margin-bottom:30px;
        }

        .products {
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
            gap:20px;
        }

        .product-card {
            background:white;
            border-radius:12px;
            padding:10px;
            text-align:center;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .product-img {
            height:200px;
            display:flex;
            justify-content:center;
            align-items:center;
            background:white;
            border-radius:10px;
        }

        .product-img img {
            max-width:100%;
            max-height:100%;
            object-fit:contain;
        }

        .price {
            font-size:20px;
            color:#0C2B4E;
            font-weight:600;
        }
    </style>
</head>

<body>

<h1>{{ cat|capitalize }} Products</h1>

<div class="products">

    {% for p in products %}
    <div class="product-card">

        <div class="product-img">
            <img src="/static/uploads/{{ p[4] }}">
        </div>

        <h2>{{ p[1] }}</h2>
        <p>{{ p[2] }}</p>
        <div class="price">₹{{ p[3] }}</div>

    </div>
    {% endfor %}

</div>

</body>
</html>
