<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body { 
            background: #FFF7F3; 
            font-family: Poppins; 
            text-align: center; 
            padding-top: 80px;
        }
        .box {
            width: 350px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #C599B6; }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #C599B6;
            border-radius: 8px;
        }
        button {
            background: #C599B6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .error { color: red; margin: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h1>Admin Login</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="id" placeholder="Enter Admin ID" required>
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
