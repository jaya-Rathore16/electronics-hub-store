<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body { 
            font-family: Poppins; 
            background: #F4F4F4; 
            padding: 30px; 
        }

        h1 { 
            color: #0C2B4E; 
            text-align: center;
        }

        .add-btn {
            display: inline-block;
            background: #1A3D64;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
            margin-left: 20%;
        }

        table { 
            width: 60%; 
            margin: auto; 
            background: white; 
            border-radius: 10px; 
            padding: 20px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        th {
            background: #1D546C; 
            color: white; 
            padding: 10px;
        }

        td { 
            padding: 15px; 
            text-align: center; 
            color: #0C2B4E;
        }

        .btn { 
            background: #1A3D64; 
            color: white; 
            padding: 7px 15px; 
            border-radius: 5px; 
            border: none; 
            cursor: pointer; 
        }

        input { 
            padding: 7px; 
            border-radius: 5px; 
            border: 1px solid #1D546C; 
        }
    </style>
</head>

<body>

<h1>Admin Dashboard</h1>

<!-- ⭐ ADD NEW PRODUCT BUTTON -->

<a href="/add_product" 
   style="background:#1A3D64; color:white; padding:10px 18px;
          border-radius:8px; text-decoration:none; font-weight:600;
          display:inline-block; margin-left:20%; margin-bottom:20px;">
    + Add New Product
</a>
<div style="text-align:right; margin-right:20%; margin-bottom:20px;">
    <a href="/logout" 
       style="background:#D9534F; color:white; padding:10px 18px;
              border-radius:8px; text-decoration:none; font-weight:600;">
        Logout
    </a>
</div>




<table>
    <tr>
        <th>Product</th>
        <th>Current Price</th>
        <th>Update Price</th>
        <th>Action</th>
    </tr>

    {% for p in products %}
    <tr>
        <td>{{ p[1] }}</td>
        <td>₹{{ p[3] }}</td>
        <td>
            <a href="/delete_product/{{ p[0] }}" 
              style="background:#D9534F; color:white; padding:7px 15px;
                      border-radius:5px; text-decoration:none;">
                Delete
            </a>
        </td>


        <form method="POST" action="/update_price">
            <td>
                <input type="number" name="price" required>
                <input type="hidden" name="id" value="{{ p[0] }}">
            </td>
            <td><button class="btn">Update</button></td>
        </form>
    </tr>
    {% endfor %}
</table>

</body>
</html>
